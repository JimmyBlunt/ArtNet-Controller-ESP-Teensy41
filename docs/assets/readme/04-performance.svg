" font-size="43" fill="#eef5ff" font-weight="650" text-anchor="start">Receive rate is not display rate.</text><text x="56" y="143" font-size="22" fill="#a7bad2" font-weight="400" text-anchor="start">Archived hardware run · 13 Sep 2026 · 4,031 pixels · 29 universes · 40 FPS sender target / 30 FPS output target</text><rect x="56" y="203" width="422" height="171" rx="18" fill="url(#glass)" stroke="#51ddea" stroke-opacity=".48"/><path d="M80 203 H454" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M80 203 H454" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="237" font-size="16" fill="#51ddea" font-weight="650" text-anchor="start">COMPLETE FRAMES</text><text x="80" y="303" font-size="59" fill="#eef5ff" font-weight="650" text-anchor="start">1,195</text><text x="80" y="346" font-size="22" fill="#a7bad2" font-weight="400" text-anchor="start">39.81 complete frames/s</text><rect x="509" y="203" width="422" height="171" rx="18" fill="url(#glass)" stroke="#69e4b5" stroke-opacity=".48"/><path d="M533 203 H907" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M533 203 H907" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="533" y="237" font-size="16" fill="#69e4b5" font-weight="650" text-anchor="start">DMA COMPLETIONS</text><text x="533" y="303" font-size="59" fill="#eef5ff" font-weight="650" text-anchor="start">900</text><text x="533" y="346" font-size="22" fill="#a7bad2" font-weight="400" text-anchor="start">29.98 completions/s</text><rect x="962" y="203" width="422" height="171" rx="18" fill="url(#glass)" stroke="#f887bd" stroke-opacity=".48"/><path d="M986 203 H1360" fill="none" stroke="#f887bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M986 203 H1360" fill="none" stroke="#f887bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="986" y="237" font-size="16" fill="#f887bd" font-weight="650" text-anchor="start">WAITING FRAMES REPLACED</text><text x="986" y="303" font-size="59" fill="#eef5ff" font-weight="650" text-anchor="start">295</text><text x="986" y="346" font-size="22" fill="#a7bad2" font-weight="400" text-anchor="start">Newest complete frame wins</text><text x="56" y="417" font-size="16" fill="#51ddea" font-weight="650" text-anchor="start">SETTLED RUN: 1,195 COMPLETE = 900 OUTPUT + 295 REPLACED</text><rect x="56" y="441" width="962.51" height="25" rx="7" fill="#69e4b5"/><rect x="1018.51" y="441" width="315.49" height="25" rx="7" fill="#f887bd"/><text x="56" y="502" font-size="23" fill="#a7bad2" font-weight="400" text-anchor="start">34,655 / 34,655 packets received · 0 incomplete frames · 0 UDP queue drops</text><rect x="56" y="548" width="646" height="197" rx="18" fill="url(#glass)" stroke="#ac8cff" stroke-opacity=".48"/><path d="M80 548 H678" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M80 548 H678" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="582" font-size="16" fill="#ac8cff" font-weight="650" text-anchor="start">CODE-DERIVED OUTPUT BUDGET</text><text x="80" y="622" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">The longest parallel lane sets wire time.</text><text x="80" y="659" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Wire guard = 30 µs × longest lane + 300 µs</text><text x="80" y="688" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">880 pixels → 26.70 ms guard</text><text x="80" y="717" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Period = max(ceil(1,000,000 / target FPS), guard)</text><rect x="738" y="548" width="646" height="197" rx="18" fill="url(#glass)" stroke="#ffb86c" stroke-opacity=".48"/><path d="M762 548 H1360" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M762 548 H1360" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="762" y="582" font-size="16" fill="#ffb86c" font-weight="650" text-anchor="start">WHERE WORK CAN ACCUMULATE</text><text x="762" y="622" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">Network burst → CPU → LED output</text><text x="762" y="659" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">32 RX descriptors → 96-packet UDP queue</text><text x="762" y="688" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Copy + FastLED.show() preparation use CPU time</text><text x="762" y="717" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">DMA runs asynchronously; completion is polled</text><text x="56" y="794" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">~30-second black-payload run; counters do not verify optical FPS or pixel integrity. These are observations, not rated limits.</text><text x="56" y="828" font-size="18" fill="#51ddea" font-weight="400" text-anchor="start">Source: reports/ethernet-matrix-20260913/ergebnisse.csv · profile “aktuell”, requested 40 FPS</text></g></svg>
