<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Measured frame replacement and timing bottlenecks</title><desc id="desc">Measured September 13 run: 1195 complete frames, 900 DMA completions and 295 replaced waiting frames. No missing packets or incomplete frames in this case. Output target was 30 FPS. Longest-lane wire guard and CPU/network buffering are separate constraints. Black-payload counters are not optical verification.</desc>
