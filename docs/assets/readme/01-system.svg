<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Art-Net controller architecture and dependencies</title><desc id="desc">Layered network, frame assembly and LED output. ESP32 uses Wi-Fi and per-universe sequence state; Teensy uses native Ethernet and a controller-wide frame mask. Web control and telemetry are separate paths. Fixed Octo pin mapping shown; physical connector identification remains an acceptance task.</desc>
