ght="650" text-anchor="start">NATIVE ETHERNET NODE</text><text x="674" y="493" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">Teensy 4.1</text><text x="674" y="530" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">QNEthernet → global frame mask</text><text x="674" y="559" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">FastLED Channels / ObjectFLED</text><text x="674" y="588" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Octo adapter → 8 WS2812B lanes</text><text x="674" y="617" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Level shifting + 2 LED RJ45s</text><rect x="1036" y="201" width="348" height="188" rx="18" fill="url(#glass)" stroke="#69e4b5" stroke-opacity=".48"/><path d="M1060 201 H1360" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M1060 201 H1360" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1060" y="235" font-size="16" fill="#69e4b5" font-weight="650" text-anchor="start">CONTROL PLANE</text><text x="1060" y="275" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">Web interface</text><text x="1060" y="312" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Configuration + start / stop</text><text x="1060" y="341" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Per-port tests + preview</text><text x="1060" y="370" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">ESP: NVS / Teensy: EEPROM</text><rect x="1036" y="419" width="348" height="215" rx="18" fill="url(#glass)" stroke="#ffb86c" stroke-opacity=".48"/><path d="M1060 419 H1360" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M1060 419 H1360" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linec