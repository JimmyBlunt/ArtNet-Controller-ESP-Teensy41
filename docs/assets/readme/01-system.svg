ff" font-weight="650" >Teensy 4.1</text><text x="478" y="457" font-size="19" fill="#a4b3cb" font-weight="400" >FastLED Channels · ObjectFLED</text><path d="M784 251 H894" fill="none" stroke="#69dded" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M784 417 H894" fill="none" stroke="#aa91ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="906" y="190" width="326" height="122" rx="16" fill="#111c32" stroke="#2a3855"/><path d="M925 191 H1213" stroke="#69dded" stroke-opacity=".6" stroke-width="2"/><text x="930" y="228" font-size="25" fill="#edf2ff" font-weight="600" >WS2812B + APA102</text><text x="930" y="260" font-size="19" fill="#a4b3cb" font-weight="400" >Pins und Längen je Profil</text><text x="930" y="290" font-size="19" fill="#a4b3cb" font-weight="400" >Konfiguration in NVS</text><rect x="906" y="356" width="326" height="122" rx="16" fill="#111c32" stroke="#2a3855"/><path d="M925 357 H1213" stroke="#aa91ff" stroke-opacity=".6" stroke-width="2"/><text x="930" y="394" font-size="25" fill="#edf2ff" font-weight="600" >OCTO-ADAPTER</text><text x="930" y="427" font-size="19" fill="#a4b3cb" font-weight="400" >Pegelwandlung · 2 × RJ45</text><text x="930" y="457" font-size="19" fill="#a4b3cb" font-weight="400" >8 feste WS2812B-Ausgänge</text><path d="M48 519 H1232" fill="none" stroke="#293451" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="552" font-size="19" fill="#a4b3cb" font-weight="400" >Browser → Konfiguration · Porttests · Diagnose</text><text x="1232" y="552" font-size="17" fill="#a4b3cb" font-weight="400" text-anchor="end">Quellcode, Web-Assets und Buildprofile im Repository</text></g></svg>
