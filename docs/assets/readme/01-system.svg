_ADAPTER_T41</text><text x="437" y="776" font-size="25" fill="#eef5ff" font-weight="600" text-anchor="start">OUT 1–8 → pins 2 · 14 · 7 · 8 · 6 · 20 · 21 · 5</text></g></svg>
