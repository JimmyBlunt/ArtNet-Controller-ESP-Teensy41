<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 646" width="1280" height="646" role="img" aria-labelledby="title desc">
<title id="title">Teensy Art-Net-Empfang und DMA-Ausgabe</title><desc id="desc">Pakete prüfen, alle erwarteten Universes sammeln, vollständigen Frame puffern und erst bei aktiver Ausgabe, freiem DMA und fälligem Ausgabezeitpunkt ausgeben. Teilframes verfallen nach mehr als 100 Millisekunden.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1225"/><stop offset="1" stop-color="#12152d"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#6053ad" stop-opacity=".18"/><stop offset="1" stop-color="#6053ad" stop-opacity="0"/></radialGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a4b3cb" stroke-width="1.4"/></marker>
</defs>
<rect width="1280" height="646" rx="24" fill="url(#bg)"/>
<ellipse cx="1120" cy="100" rx="420" ry="320" fill="url(#light)"/>
<g fill="none" stroke="#738bcb" opacity=".09"><path d="M0 28 H186 L218 60 H320"/><path d="M0 38 H178 L210 70 H346"/><path d="M1050 646 V608 L1082 576 H1280"/><circle cx="-150" cy="596" r="250"/><circle cx="-150" cy="596" r="268"/></g>
<g font-family="Segoe UI,Inter,Arial,sans-serif"><text x="48" y="43" font-size="14" fill="#69dded" font-weight="600" letter-spacing="3">ART·NET   /   02  FRAME PIPELINE</text><text x="48" y="100" font-size="42" fill="#edf2ff" font-weight="650" >Vom Paket zum vollständigen LED-Frame.</text><text x="48" y="139" font-size="20" fill="#a4b3cb" font-weight="400" >Teensy-Webbuild · gemeinsame Frame-Sammlung für alle aktiven Ausgänge.</text><rect x="48" y="201" width="278" height="160" rx="16" fill="#111c32" stroke="#2a3855"/><path d="M67 202 H307" stroke="#69dded" stroke-opacity=".6" stroke-width="2"/><text x="68" y="233" font-size="14" fill="#69dded" font-weight="600" >01 / EMPFANG</text><text x="68" y="273" font-size="23" fill="#edf2ff" font-weight="600" >ArtDmx prüfen</text><text x="68" y="311" font-size="18" fill="#a4b3cb" font-weight="400" >Header · Universe · Länge</text><text x="68" y="339" font-size="18" fill="#a4b3cb" font-weight="400" >Nur konfigurierte Routen</text><path d="M327 281 H346" fill="none" stroke="#69dded" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="350" y="201" width="278" height="160" rx="16" fill="#111c32" stroke="#2a3855"/><path d="M369 202 H609" stroke="#69dded" stroke-opacity=".6" stroke-width="2"/><text x="370" y="233" font-size="14" fill="#69dded" font-weight="600" >02 / SAMMLUNG</text><text x="370" y="273" font-size="23" fill="#edf2ff" font-weight="600" >Universes sammeln</text><text x="370" y="311" font-size="18" fill="#a4b3cb" font-weight="400" >Alle aktiven Routen nötig</text><text x="370" y="339" font-size="18" fill="#a4b3cb" font-weight="400" >Eine gemeinsame Maske</text><path d="M629 281 H648" fill="none" stroke="#69dded" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="652" y="201" width="278" height="160" rx="16" fill="#111c32" stroke="#2a3855"/><path d="M671 202 H911" stroke="#69dded" stroke-opacity=".6" stroke-width="2"/><text x="672" y="233" font-size="14" fill="#69dded" font-weight="600" >03 / BEREIT</text><text x="672" y="273" font-size="23" fill="#edf2ff" font-weight="600" >Frame übernehmen</text><text x="672" y="311" font-size="18" fill="#a4b3cb" font-weight="400" >Nur vollständige Bilder</text><text x="672" y="339" font-size="18" fill="#a4b3cb" font-weight="400" >Neuestes ersetzt wartendes</text><path d="M931 281 H950" fill="none" stroke="#69dded" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="954" y="201" width="278" height="160" rx="16" fill="#111c32" stroke="#2a3855"/><path d="M973 202 H1213" stroke="#aa91ff" stroke-opacity=".6" stroke-width="2"/><text x="974" y="233" font-size="14" fill="#aa91ff" font-weight="600" >04 / AUSGABE</text><text x="974" y="273" font-size="23" fill="#edf2ff" font-weight="600" >FastLED.show()</text><text x="974" y="311" font-size="18" fill="#a4b3cb" font-weight="400" >Art-Net AN · DMA frei</text><text x="974" y="339" font-size="18" fill="#a4b3cb" font-weight="400" >Ausgabezeitpunkt erreicht</text><path d="M489 362 V404" fill="none" stroke="#69dded" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 7"/><rect x="350" y="416" width="580" height="88" rx="16" fill="#111c32" stroke="#2a3855"/><path d="M369 417 H911" stroke="#69dded" stroke-opacity=".6" stroke-width="2"/><text x="374" y="451" font-size="23" fill="#edf2ff" font-weight="600" >Teilframe &gt; 100 ms → verwerfen</text><text x="374" y="481" font-size="18" fill="#a4b3cb" font-weight="400" >Gezählt ab dem ersten akzeptierten Paket des Kandidaten.</text><path d="M1093 362 V414" fill="none" stroke="#aa91ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1093" y="449" font-size="21" fill="#aa91ff" font-weight="600" text-anchor="middle">ObjectFLED / DMA</text><text x="1093" y="480" font-size="19" fill="#a4b3cb" font-weight="400" text-anchor="middle">Transfer + Latch</text><path d="M48 543 H1232" fill="none" stroke="#293451" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="578" font-size="20" fill="#a4b3cb" font-weight="400" >Sequence ≠ 0: gemeinsam für alle Universes. Sequence 0: Sammlung ohne Sequenzsortierung.</text><text x="48" y="613" font-size="18" fill="#a4b3cb" font-weight="400" >ArtSync wird nicht ausgewertet. ESP32 verarbeitet die Sequence in seinem eigenen Receiver pro Universe.</text></g></svg>
