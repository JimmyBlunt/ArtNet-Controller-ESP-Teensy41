<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
<title id="title">ArtDmx packet anatomy and Teensy frame assembly</title><desc id="desc">ArtDmx has an 18-byte header and an even 2–512-byte payload. This Teensy receiver requires all active route bits under one shared non-zero sequence. Defaults expect 29 universes, excluding gaps and disabled ports. OUT1 illustrates an even-padded short last packet. ArtSync is not implemented.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050c19"/><stop offset=".55" stop-color="#0a1428"/><stop offset="1" stop-color="#100d24"/></linearGradient>
<linearGradient id="glass" x2=".6" y2="1"><stop stop-color="#172f48" stop-opacity=".78"/><stop offset="1" stop-color="#0c1428" stop-opacity=".94"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#305975" stop-opacity=".3"/><stop offset="1" stop-color="#132139" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#c7e1f3" stroke-width="1.7"/></marker>
</defs><rect width="1440" height="880" rx="24" fill="url(#bg)"/>
<ellipse cx="400" cy="450" rx="530" ry="420" fill="url(#halo)"/>
<g opacity=".2"><path d="M0 230 H24 L64 270" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 490 H1416 L1376 450" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 265 H32 L72 305" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 525 H1408 L1368 485" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 300 H40 L80 340" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 560 H1400 L1360 520" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 335 H48 L88 375" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 595 H1392 L1352 555" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 370 H56 L96 410" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 630 H1384 L1344 590" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 405 H64 L104 445" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 665 H1376 L1336 625" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 440 H72 L112 480" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 700 H1368 L1328 660" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g font-family="Segoe UI,Arial,sans-serif"><text x="56" y="46" font-size="16" fill="#51ddea" font-weight="650" text-anchor="start">ART-NET CONTROLLER   /   02 / PACKETS → FRAMES</text><text x="56" y="102" font-size="43" fill="#eef5ff" font-weight="650" text-anchor="start">A packet carries one universe.</text><text x="56" y="143" font-size="22" fill="#a7bad2" font-weight="400" text-anchor="start">A complete LED frame is a receiver-defined set of active universes, not one UDP datagram.</text><rect x="56" y="190" width="252" height="95" rx="18" fill="url(#glass)" stroke="#51ddea" stroke-opacity=".48"/><path d="M80 190 H284" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M80 190 H284" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="219" font-size="16" fill="#51ddea" font-weight="650" text-anchor="start">BYTE 0–7</text><text x="70" y="256" font-size="18" fill="#eef5ff" font-weight="400" text-anchor="start">Art-Net + NUL</text><rect x="316" y="190" width="200" height="95" rx="18" fill="url(#glass)" stroke="#51ddea" stroke-opacity=".48"/><path d="M340 190 H492" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M340 190 H492" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="219" font-size="16" fill="#51ddea" font-weight="650" text-anchor="start">BYTE 8–9</text><text x="330" y="256" font-size="18" fill="#eef5ff" font-weight="400" text-anchor="start">0x5000 / LE</text><rect x="524" y="190" width="200" height="95" rx="18" fill="url(#glass)" stroke="#51ddea" stroke-opacity=".48"/><path d="M548 190 H700" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M548 190 H700" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="538" y="219" font-size="16" fill="#51ddea" font-weight="650" text-anchor="start">BYTE 10–11</text><text x="538" y="256" font-size="18" fill="#eef5ff" font-weight="400" text-anchor="start">Version / BE</text><rect x="732" y="190" width="160" height="95" rx="18" fill="url(#glass)" stroke="#ac8cff" stroke-opacity=".48"/><path d="M756 190 H868" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M756 190 H868" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="746" y="219" font-size="16" fill="#ac8cff" font-weight="650" text-anchor="start">BYTE 12</text><text x="746" y="256" font-size="18" fill="#eef5ff" font-weight="400" text-anchor="start">Sequence</text><rect x="900" y="190" width="138" height="95" rx="18" fill="url(#glass)" stroke="#ac8cff" stroke-opacity=".48"/><path d="M924 190 H1014" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M924 190 H1014" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="914" y="219" font-size="16" fill="#ac8cff" font-weight="650" text-anchor="start">BYTE 13</text><text x="914" y="256" font-size="18" fill="#eef5ff" font-weight="400" text-anchor="start">Physical</text><rect x="1046" y="190" width="190" height="95" rx="18" fill="url(#glass)" stroke="#ac8cff" stroke-opacity=".48"/><path d="M1070 190 H1212" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M1070 190 H1212" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1060" y="219" font-size="16" fill="#ac8cff" font-weight="650" text-anchor="start">BYTE 14–15</text><text x="1060" y="256" font-size="18" fill="#eef5ff" font-weight="400" text-anchor="start">Address / LE</text><rect x="1244" y="190" width="132" height="95" rx="18" fill="url(#glass)" stroke="#ffb86c" stroke-opacity=".48"/><path d="M1268 190 H1352" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M1268 190 H1352" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1258" y="219" font-size="16" fill="#ffb86c" font-weight="650" text-anchor="start">BYTE 16–17</text><text x="1258" y="256" font-size="18" fill="#eef5ff" font-weight="400" text-anchor="start">Length / BE</text><rect x="56" y="303" width="1328" height="61" rx="18" fill="url(#glass)" stroke="#69e4b5" stroke-opacity=".48"/><path d="M80 303 H1360" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M80 303 H1360" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="342" font-size="22" fill="#69e4b5" font-weight="400" text-anchor="start">18…  DMX payload: even length 2–512 bytes   •   This project maps 170 RGB pixels into 510 channels.</text><rect x="56" y="412" width="308" height="175" rx="18" fill="url(#glass)" stroke="#51ddea" stroke-opacity=".48"/><path d="M80 412 H340" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M80 412 H340" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="446" font-size="16" fill="#51ddea" font-weight="650" text-anchor="start">01 / VALIDATE</text><text x="80" y="486" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">Check the datagram</text><text x="80" y="523" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Header, opcode, version</text><text x="80" y="552" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Exact size = 18 + length</text><path d="M364 499 H391" fill="none" stroke="#51ddea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M364 499 H391" fill="none" stroke="#51ddea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="396" y="412" width="308" height="175" rx="18" fill="url(#glass)" stroke="#51ddea" stroke-opacity=".48"/><path d="M420 412 H680" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M420 412 H680" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="446" font-size="16" fill="#51ddea" font-weight="650" text-anchor="start">02 / ROUTE</text><text x="420" y="486" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">Match active output</text><text x="420" y="523" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Universe → RGB offset</text><text x="420" y="552" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Enough bytes for this route</text><path d="M704 499 H731" fill="none" stroke="#51ddea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M704 499 H731" fill="none" stroke="#51ddea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="736" y="412" width="308" height="175" rx="18" fill="url(#glass)" stroke="#ac8cff" stroke-opacity=".48"/><path d="M760 412 H1020" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M760 412 H1020" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="760" y="446" font-size="16" fill="#ac8cff" font-weight="650" text-anchor="start">03 / COLLECT</text><text x="760" y="486" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">Set the route bit</text><text x="760" y="523" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">One shared sequence*</text><text x="760" y="552" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">All expected bits received</text><path d="M1044 499 H1071" fill="none" stroke="#ac8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M1044 499 H1071" fill="none" stroke="#ac8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1076" y="412" width="308" height="175" rx="18" fill="url(#glass)" stroke="#69e4b5" stroke-opacity=".48"/><path d="M1100 412 H1360" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M1100 412 H1360" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1100" y="446" font-size="16" fill="#69e4b5" font-weight="650" text-anchor="start">04 / READY</text><text x="1100" y="486" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">Publish the frame</text><text x="1100" y="523" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Copy complete RGB data</text><text x="1100" y="552" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Replace older waiting frame</text><rect x="56" y="632" width="822" height="169" rx="18" fill="url(#glass)" stroke="#ac8cff" stroke-opacity=".48"/><path d="M80 632 H854" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M80 632 H854" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="666" font-size="16" fill="#ac8cff" font-weight="650" text-anchor="start">DEFAULT TEENSY MAP / 29 ACTIVE UNIVERSES</text><rect x="82" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><text x="91" y="741" font-size="14" fill="#51ddea" font-weight="400" text-anchor="middle">120</text><rect x="107" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="132" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="157" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="182" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="207" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="232" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="257" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="282" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="307" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="332" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="357" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="382" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="407" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="432" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="457" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="482" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="507" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="532" y="692" width="18" height="26" rx="4" fill="#a7bad2" fill-opacity="0.12"/><text x="541" y="741" font-size="14" fill="#a7bad2" font-weight="400" text-anchor="middle">138</text><rect x="557" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="582" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="607" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="632" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="657" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="682" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="707" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="732" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="757" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="782" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><rect x="807" y="692" width="18" height="26" rx="4" fill="#51ddea" fill-opacity="0.65"/><text x="816" y="741" font-size="14" fill="#51ddea" font-weight="400" text-anchor="middle">149</text><text x="80" y="777" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">120–137 + 139–149 expected; 138 and disabled OUT8 are excluded.</text><rect x="906" y="632" width="478" height="169" rx="18" fill="url(#glass)" stroke="#ffb86c" stroke-opacity=".48"/><path d="M930 632 H1360" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M930 632 H1360" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="930" y="666" font-size="16" fill="#ffb86c" font-weight="650" text-anchor="start">SHORT LAST PACKET / OUT1</text><text x="930" y="703" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">203 pixels = 170 + 33</text><text x="930" y="740" font-size="19" fill="#a7bad2" font-weight="400" text-anchor="start">U120: 510 bytes · U121: 99 RGB bytes</text><text x="930" y="774" font-size="20" fill="#69e4b5" font-weight="400" text-anchor="start">Send 100 bytes for U121 (even padding).</text><text x="56" y="843" font-size="18" fill="#a7bad2" font-weight="400" text-anchor="start">* Shared non-zero sequence is a Teensy implementation contract. ESP tracks sequence per universe. Neither path implements ArtSync.</text></g></svg>
