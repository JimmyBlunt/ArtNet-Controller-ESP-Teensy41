<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Teensy automatic start and port test workflow</title><desc id="desc">Valid configuration starts armed. Complete data, idle DMA and an elapsed output period permit rendering. Signal loss blacks out once and recovery is automatic. Select one or all active ports and a single or looping RGB running-light test. The web preview is not physical feedback.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050c19"/><stop offset=".55" stop-color="#0a1428"/><stop offset="1" stop-color="#100d24"/></linearGradient>
<linearGradient id="glass" x2=".6" y2="1"><stop stop-color="#172f48" stop-opacity=".78"/><stop offset="1" stop-color="#0c1428" stop-opacity=".94"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#305975" stop-opacity=".3"/><stop offset="1" stop-color="#132139" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#c7e1f3" stroke-width="1.7"/></marker>
</defs><rect width="1440" height="860" rx="24" fill="url(#bg)"/>
<ellipse cx="400" cy="450" rx="530" ry="420" fill="url(#halo)"/>
<g opacity=".2"><path d="M0 230 H24 L64 270" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 490 H1416 L1376 450" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 265 H32 L72 305" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 525 H1408 L1368 485" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 300 H40 L80 340" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 560 H1400 L1360 520" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 335 H48 L88 375" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 595 H1392 L1352 555" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 370 H56 L96 410" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 630 H1384 L1344 590" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 405 H64 L104 445" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 665 H1376 L1336 625" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 440 H72 L112 480" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 700 H1368 L1328 660" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g font-family="Segoe UI,Arial,sans-serif"><text x="56" y="46" font-size="16" fill="#51ddea" font-weight="650" text-anchor="start">ART-NET CONTROLLER   /   03 / CONTROL &amp; TESTING</text><text x="56" y="102" font-size="43" fill="#eef5ff" font-weight="650" text-anchor="start">Make every output observable.</text><text x="56" y="143" font-size="22" fill="#a7bad2" font-weight="400" text-anchor="start">Start automatically, isolate a port, inspect a pattern, then return to the Art-Net stream.</text><rect x="56" y="204" width="422" height="183" rx="18" fill="url(#glass)" stroke="#51ddea" stroke-opacity=".48"/><path d="M80 204 H454" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M80 204 H454" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="238" font-size="16" fill="#51ddea" font-weight="650" text-anchor="start">01 / BOOT</text><text x="80" y="278" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">Art-Net ON</text><text x="80" y="315" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Valid configuration required</text><text x="80" y="344" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Black until a complete frame</text><path d="M478 296 H505" fill="none" stroke="#51ddea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M478 296 H505" fill="none" stroke="#51ddea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="509" y="204" width="422" height="183" rx="18" fill="url(#glass)" stroke="#ac8cff" stroke-opacity=".48"/><path d="M533 204 H907" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M533 204 H907" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="533" y="238" font-size="16" fill="#ac8cff" font-weight="650" text-anchor="start">02 / STREAM</text><text x="533" y="278" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">Render when ready</text><text x="533" y="315" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Armed + complete + DMA idle</text><text x="533" y="344" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Output period must be due</text><path d="M931 296 H958" fill="none" stroke="#ac8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M931 296 H958" fill="none" stroke="#ac8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="962" y="204" width="422" height="183" rx="18" fill="url(#glass)" stroke="#ffb86c" stroke-opacity=".48"/><path d="M986 204 H1360" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M986 204 H1360" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="986" y="238" font-size="16" fill="#ffb86c" font-weight="650" text-anchor="start">03 / SIGNAL LOSS</text><text x="986" y="278" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">Black once</text><text x="986" y="315" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">No complete frame &gt; 1 s</text><text x="986" y="344" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Remain armed; auto-recover</text><path d="M1173 387 V415 H720 V387" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M1173 387 V415 H720 V387" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8" marker-end="url(#arrow)"/><text x="867" y="443" font-size="16" fill="#51ddea" font-weight="650" text-anchor="start">COMPLETE DATA RETURNS</text><rect x="56" y="480" width="1328" height="231" rx="18" fill="url(#glass)" stroke="#ac8cff" stroke-opacity=".48"/><path d="M80 480 H1360" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M80 480 H1360" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="516" font-size="16" fill="#ac8cff" font-weight="650" text-anchor="start">LOCAL PORT TEST / INDEPENDENT OF INCOMING ARTDMX</text><text x="80" y="559" font-size="28" fill="#eef5ff" font-weight="600" text-anchor="start">Select</text><text x="80" y="597" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">One port or all active ports</text><text x="80" y="630" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Once (~20 s) or continuous loop</text><path d="M418 584 H485" fill="none" stroke="#ac8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M418 584 H485" fill="none" stroke="#ac8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="513" y="559" font-size="28" fill="#eef5ff" font-weight="600" text-anchor="start">Animate</text><circle cx="523" cy="592" r="8" fill="#ff6c85" opacity=".4" filter="url(#glow)"/><circle cx="523" cy="592" r="4" fill="#ff6c85"/><circle cx="543" cy="592" r="14" fill="#ff6c85" opacity=".4" filter="url(#glow)"/><circle cx="543" cy="592" r="7" fill="#ff6c85"/><circle cx="563" cy="592" r="8" fill="#ff6c85" opacity=".4" filter="url(#glow)"/><circle cx="563" cy="592" r="4" fill="#ff6c85"/><circle cx="583" cy="592" r="8" fill="#ff6c85" opacity=".4" filter="url(#glow)"/><circle cx="583" cy="592" r="4" fill="#ff6c85"/><circle cx="603" cy="592" r="8" fill="#ff6c85" opacity=".4" filter="url(#glow)"/><circle cx="603" cy="592" r="4" fill="#ff6c85"/><circle cx="523" cy="620" r="8" fill="#69e4b5" opacity=".4" filter="url(#glow)"/><circle cx="523" cy="620" r="4" fill="#69e4b5"/><circle cx="543" cy="620" r="8" fill="#69e4b5" opacity=".4" filter="url(#glow)"/><circle cx="543" cy="620" r="4" fill="#69e4b5"/><circle cx="563" cy="620" r="14" fill="#69e4b5" opacity=".4" filter="url(#glow)"/><circle cx="563" cy="620" r="7" fill="#69e4b5"/><circle cx="583" cy="620" r="8" fill="#69e4b5" opacity=".4" filter="url(#glow)"/><circle cx="583" cy="620" r="4" fill="#69e4b5"/><circle cx="603" cy="620" r="8" fill="#69e4b5" opacity=".4" filter="url(#glow)"/><circle cx="603" cy="620" r="4" fill="#69e4b5"/><circle cx="523" cy="648" r="8" fill="#7ca5ff" opacity=".4" filter="url(#glow)"/><circle cx="523" cy="648" r="4" fill="#7ca5ff"/><circle cx="543" cy="648" r="8" fill="#7ca5ff" opacity=".4" filter="url(#glow)"/><circle cx="543" cy="648" r="4" fill="#7ca5ff"/><circle cx="563" cy="648" r="8" fill="#7ca5ff" opacity=".4" filter="url(#glow)"/><circle cx="563" cy="648" r="4" fill="#7ca5ff"/><circle cx="583" cy="648" r="14" fill="#7ca5ff" opacity=".4" filter="url(#glow)"/><circle cx="583" cy="648" r="7" fill="#7ca5ff"/><circle cx="603" cy="648" r="8" fill="#7ca5ff" opacity=".4" filter="url(#glow)"/><circle cx="603" cy="648" r="4" fill="#7ca5ff"/><text x="647" y="601" font-size="22" fill="#eef5ff" font-weight="400" text-anchor="start">R → G → B</text><text x="647" y="635" font-size="19" fill="#a7bad2" font-weight="400" text-anchor="start">Running-light pattern</text><path d="M873 584 H940" fill="none" stroke="#69e4b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M873 584 H940" fill="none" stroke="#69e4b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="968" y="559" font-size="28" fill="#eef5ff" font-weight="600" text-anchor="start">Restore</text><text x="968" y="598" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Return to the previous state</text><text x="968" y="631" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Confirm the physical output</text><text x="80" y="683" font-size="21" fill="#a7bad2" font-weight="400" text-anchor="start">Web preview shows the commanded color and pattern; a camera or direct inspection verifies actual LEDs.</text><rect x="56" y="749" width="1328" height="62" rx="18" fill="url(#glass)" stroke="#69e4b5" stroke-opacity=".48"/><path d="M80 749 H1360" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M80 749 H1360" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="789" font-size="21" fill="#69e4b5" font-weight="400" text-anchor="start">ACCEPTANCE   Identify and label each RJ45 lane individually → verify all active lanes in parallel → test stream recovery.</text></g></svg>
