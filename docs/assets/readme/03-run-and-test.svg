<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 666" width="1280" height="666" role="img" aria-labelledby="title desc">
<title id="title">Teensy Autostart und Porttest-Ablauf</title><desc id="desc">Beim Boot gültige Konfiguration laden, Art-Net aktivieren, schwarz senden und auf vollständige Daten warten. Porttests laufen einmal oder im Loop. Testende stellt nach Schwarz den vorherigen Modus wieder her; globaler Stop bleibt wirksam.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1225"/><stop offset="1" stop-color="#12152d"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#6053ad" stop-opacity=".18"/><stop offset="1" stop-color="#6053ad" stop-opacity="0"/></radialGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a4b3cb" stroke-width="1.4"/></marker>
</defs>
<rect width="1280" height="666" rx="24" fill="url(#bg)"/>
<ellipse cx="1120" cy="100" rx="420" ry="320" fill="url(#light)"/>
<g fill="none" stroke="#738bcb" opacity=".09"><path d="M0 28 H186 L218 60 H320"/><path d="M0 38 H178 L210 70 H346"/><path d="M1050 666 V628 L1082 596 H1280"/><circle cx="-150" cy="616" r="250"/><circle cx="-150" cy="616" r="268"/></g>
<g font-family="Segoe UI,Inter,Arial,sans-serif"><text x="48" y="43" font-size="14" fill="#69dded" font-weight="600" letter-spacing="3">ART·NET   /   03  RUN / TEST</text><text x="48" y="100" font-size="42" fill="#edf2ff" font-weight="650" >Automatisch starten. Gezielt testen.</text><text x="48" y="139" font-size="20" fill="#a4b3cb" font-weight="400" >Teensy-Webbuild · gültige gespeicherte Konfiguration als Voraussetzung.</text><rect x="48" y="199" width="278" height="116" rx="16" fill="#111c32" stroke="#2a3855"/><path d="M67 200 H307" stroke="#69dded" stroke-opacity=".6" stroke-width="2"/><text x="67" y="226" font-size="13" fill="#69dded" font-weight="600" >01</text><text x="67" y="262" font-size="23" fill="#edf2ff" font-weight="600" >Konfiguration</text><text x="67" y="293" font-size="18" fill="#a4b3cb" font-weight="400" >Beim Boot laden</text><path d="M327 258 H346" fill="none" stroke="#69dded" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="350" y="199" width="278" height="116" rx="16" fill="#111c32" stroke="#2a3855"/><path d="M369 200 H609" stroke="#69dded" stroke-opacity=".6" stroke-width="2"/><text x="369" y="226" font-size="13" fill="#69dded" font-weight="600" >02</text><text x="369" y="262" font-size="23" fill="#edf2ff" font-weight="600" >Art-Net AN</text><text x="369" y="293" font-size="18" fill="#a4b3cb" font-weight="400" >Initiales Schwarzbild</text><path d="M629 258 H648" fill="none" stroke="#69dded" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="652" y="199" width="278" height="116" rx="16" fill="#111c32" stroke="#2a3855"/><path d="M671 200 H911" stroke="#69dded" stroke-opacity=".6" stroke-width="2"/><text x="671" y="226" font-size="13" fill="#69dded" font-weight="600" >03</text><text x="671" y="262" font-size="23" fill="#edf2ff" font-weight="600" >Auf Daten warten</text><text x="671" y="293" font-size="18" fill="#a4b3cb" font-weight="400" >Vollständigen Frame bilden</text><path d="M931 258 H950" fill="none" stroke="#69dded" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="954" y="199" width="278" height="116" rx="16" fill="#111c32" stroke="#2a3855"/><path d="M973 200 H1213" stroke="#69dded" stroke-opacity=".6" stroke-width="2"/><text x="973" y="226" font-size="13" fill="#69dded" font-weight="600" >04</text><text x="973" y="262" font-size="23" fill="#edf2ff" font-weight="600" >LEDs ausgeben</text><text x="973" y="293" font-size="18" fill="#a4b3cb" font-weight="400" >FPS- und DMA-Freigabe</text><path d="M1093 316 V348 H791 V317" fill="none" stroke="#aa91ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="791" y="379" font-size="18" fill="#a4b3cb" font-weight="400" text-anchor="middle">Signalverlust → Schwarz → automatisch auf neue Daten warten</text><text x="48" y="433" font-size="14" fill="#aa91ff" font-weight="600" letter-spacing="2">PORTTESTS</text><rect x="48" y="453" width="366" height="113" rx="16" fill="#111c32" stroke="#2a3855"/><path d="M67 454 H395" stroke="#aa91ff" stroke-opacity=".6" stroke-width="2"/><text x="70" y="490" font-size="23" fill="#edf2ff" font-weight="600" >Ein Port oder alle aktiven</text><text x="70" y="523" font-size="19" fill="#a4b3cb" font-weight="400" >Einmal: 20 Sekunden</text><text x="70" y="549" font-size="19" fill="#a4b3cb" font-weight="400" >Loop: bis zum Beenden</text><path d="M415 510 H451" fill="none" stroke="#aa91ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="463" y="453" width="354" height="113" rx="16" fill="#111c32" stroke="#2a3855"/><path d="M482 454 H798" stroke="#aa91ff" stroke-opacity=".6" stroke-width="2"/><text x="486" y="490" font-size="25" fill="#edf2ff" font-weight="600" >RGB-Lauflicht</text><rect x="486" y="512" width="20" height="20" rx="5" fill="#fc6988"/><rect x="517" y="512" width="20" height="20" rx="5" fill="#69dda7"/><rect x="548" y="512" width="20" height="20" rx="5" fill="#729bff"/><text x="583" y="529" font-size="19" fill="#a4b3cb" font-weight="400" >mit Webvorschau</text><path d="M818 510 H854" fill="none" stroke="#aa91ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="866" y="453" width="366" height="113" rx="16" fill="#111c32" stroke="#2a3855"/><path d="M885 454 H1213" stroke="#aa91ff" stroke-opacity=".6" stroke-width="2"/><text x="889" y="490" font-size="25" fill="#edf2ff" font-weight="600" >Test beenden</text><text x="889" y="523" font-size="19" fill="#a4b3cb" font-weight="400" >Schwarzbild abschließen</text><text x="889" y="549" font-size="19" fill="#a4b3cb" font-weight="400" >Vorherigen Modus herstellen</text><path d="M48 601 H1232" fill="none" stroke="#293451" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="635" font-size="19" fill="#a4b3cb" font-weight="400" >Manueller STOP bleibt wirksam bis Start oder Neustart. Die Vorschau ist keine optische Rückmeldung.</text></g></svg>
