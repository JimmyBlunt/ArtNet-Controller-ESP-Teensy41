<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Art-Net diagnostics, errors and performance tuning</title><desc id="desc">Follow packet, complete-frame, submit and DMA counters in order. Validate universe coverage, length and sequence before adjusting buffering. Distinguish intentional replacement from receive loss. Measure pacing, ring pressure and timing; use non-black patterns and physical checks.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050c19"/><stop offset=".55" stop-color="#0a1428"/><stop offset="1" stop-color="#100d24"/></linearGradient>
<linearGradient id="glass" x2=".6" y2="1"><stop stop-color="#172f48" stop-opacity=".78"/><stop offset="1" stop-color="#0c1428" stop-opacity=".94"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#305975" stop-opacity=".3"/><stop offset="1" stop-color="#132139" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#c7e1f3" stroke-width="1.7"/></marker>
</defs><rect width="1440" height="860" rx="24" fill="url(#bg)"/>
<ellipse cx="400" cy="450" rx="530" ry="420" fill="url(#halo)"/>
<g opacity=".2"><path d="M0 230 H24 L64 270" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 490 H1416 L1376 450" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 265 H32 L72 305" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 525 H1408 L1368 485" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 300 H40 L80 340" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 560 H1400 L1360 520" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 335 H48 L88 375" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 595 H1392 L1352 555" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 370 H56 L96 410" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 630 H1384 L1344 590" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 405 H64 L104 445" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 665 H1376 L1336 625" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 440 H72 L112 480" fill="none" stroke="#51ddea" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M1440 700 H1368 L1328 660" fill="none" stroke="#ac8cff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g font-family="Segoe UI,Arial,sans-serif"><text x="56" y="46" font-size="16" fill="#51ddea" font-weight="650" text-anchor="start">ART-NET CONTROLLER   /   05 / DIAGNOSE &amp; TUNE</text><text x="56" y="102" font-size="43" fill="#eef5ff" font-weight="650" text-anchor="start">Find the first stage that stops progressing.</text><text x="56" y="143" font-size="22" fill="#a7bad2" font-weight="400" text-anchor="start">Compare counter deltas over the same interval. Change one variable, repeat, and verify recovery.</text><rect x="56" y="204" width="308" height="177" rx="18" fill="url(#glass)" stroke="#51ddea" stroke-opacity=".48"/><path d="M80 204 H340" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M80 204 H340" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="238" font-size="16" fill="#51ddea" font-weight="650" text-anchor="start">01 / PACKETS</text><text x="80" y="278" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">Traffic arrives</text><text x="80" y="315" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Count includes rejected data</text><text x="80" y="344" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">890 pkt/s ≠ complete frames</text><path d="M364 293 H391" fill="none" stroke="#51ddea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M364 293 H391" fill="none" stroke="#51ddea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="396" y="204" width="308" height="177" rx="18" fill="url(#glass)" stroke="#ac8cff" stroke-opacity=".48"/><path d="M420 204 H680" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M420 204 H680" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="238" font-size="16" fill="#ac8cff" font-weight="650" text-anchor="start">02 / COMPLETE</text><text x="420" y="278" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">Frame assembled</text><text x="420" y="315" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Coverage + length + sequence</text><text x="420" y="344" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Check incomplete / rejected</text><path d="M704 293 H731" fill="none" stroke="#ac8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M704 293 H731" fill="none" stroke="#ac8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="736" y="204" width="308" height="177" rx="18" fill="url(#glass)" stroke="#69e4b5" stroke-opacity=".48"/><path d="M760 204 H1020" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M760 204 H1020" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="760" y="238" font-size="16" fill="#69e4b5" font-weight="650" text-anchor="start">03 / SUBMIT</text><text x="760" y="278" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">Output scheduled</text><text x="760" y="315" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Armed? DMA idle? Period due?</text><text x="760" y="344" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Check waiting replacements</text><path d="M1044 293 H1071" fill="none" stroke="#69e4b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M1044 293 H1071" fill="none" stroke="#69e4b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1076" y="204" width="308" height="177" rx="18" fill="url(#glass)" stroke="#ffb86c" stroke-opacity=".48"/><path d="M1100 204 H1360" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M1100 204 H1360" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1100" y="238" font-size="16" fill="#ffb86c" font-weight="650" text-anchor="start">04 / DMA</text><text x="1100" y="278" font-size="27" fill="#eef5ff" font-weight="600" text-anchor="start">Transfer completes</text><text x="1100" y="315" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Compare submit/completion</text><text x="1100" y="344" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Check timing + physical LEDs</text><path d="M210 381 V423" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M210 381 V423" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M550 381 V423" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M550 381 V423" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M890 381 V423" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M890 381 V423" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1230 381 V423" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M1230 381 V423" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="56" y="436" width="308" height="163" rx="18" fill="url(#glass)" stroke="#51ddea" stroke-opacity=".48"/><path d="M80 436 H340" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M80 436 H340" fill="none" stroke="#51ddea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="471" font-size="16" fill="#51ddea" font-weight="650" text-anchor="start">CHECK THE INPUT</text><text x="76" y="507" font-size="18" fill="#a7bad2" font-weight="400" text-anchor="start">Check target IP + UDP 6454</text><text x="76" y="536" font-size="18" fill="#a7bad2" font-weight="400" text-anchor="start">Inspect header and payload size</text><text x="76" y="565" font-size="18" fill="#a7bad2" font-weight="400" text-anchor="start">Compare sent / received counts</text><rect x="396" y="436" width="308" height="163" rx="18" fill="url(#glass)" stroke="#ac8cff" stroke-opacity=".48"/><path d="M420 436 H680" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M420 436 H680" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="416" y="471" font-size="16" fill="#ac8cff" font-weight="650" text-anchor="start">CHECK FRAME CONTRACT</text><text x="416" y="507" font-size="18" fill="#a7bad2" font-weight="400" text-anchor="start">Expect only active routes</text><text x="416" y="536" font-size="18" fill="#a7bad2" font-weight="400" text-anchor="start">Match Teensy shared sequence</text><text x="416" y="565" font-size="18" fill="#a7bad2" font-weight="400" text-anchor="start">Partial age &gt;100 ms → abandon</text><rect x="736" y="436" width="308" height="163" rx="18" fill="url(#glass)" stroke="#69e4b5" stroke-opacity=".48"/><path d="M760 436 H1020" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M760 436 H1020" fill="none" stroke="#69e4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="756" y="471" font-size="16" fill="#69e4b5" font-weight="650" text-anchor="start">CHECK OUTPUT BUDGET</text><text x="756" y="507" font-size="18" fill="#a7bad2" font-weight="400" text-anchor="start">Align input / output target FPS</text><text x="756" y="536" font-size="18" fill="#a7bad2" font-weight="400" text-anchor="start">Balance the longest LED chains</text><text x="756" y="565" font-size="18" fill="#a7bad2" font-weight="400" text-anchor="start">Separate replacement from loss</text><rect x="1076" y="436" width="308" height="163" rx="18" fill="url(#glass)" stroke="#ffb86c" stroke-opacity=".48"/><path d="M1100 436 H1360" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M1100 436 H1360" fill="none" stroke="#ffb86c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1096" y="471" font-size="16" fill="#ffb86c" font-weight="650" text-anchor="start">CHECK TRANSFER &amp; LIGHT</text><text x="1096" y="507" font-size="18" fill="#a7bad2" font-weight="400" text-anchor="start">Compare show() / DMA timing</text><text x="1096" y="536" font-size="18" fill="#a7bad2" font-weight="400" text-anchor="start">Use non-black test patterns</text><text x="1096" y="565" font-size="18" fill="#a7bad2" font-weight="400" text-anchor="start">Check wiring, power, recovery</text><rect x="56" y="644" width="1328" height="175" rx="18" fill="url(#glass)" stroke="#ac8cff" stroke-opacity=".48"/><path d="M80 644 H1360" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#glow)"/><path d="M80 644 H1360" fill="none" stroke="#ac8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="679" font-size="16" fill="#ac8cff" font-weight="650" text-anchor="start">CONTROLLED TUNING / CANDIDATES TO MEASURE</text><text x="80" y="721" font-size="25" fill="#51ddea" font-weight="600" text-anchor="start">PACE</text><text x="80" y="756" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Spread packet bursts;</text><text x="80" y="786" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">100 µs was not a universal fix.</text><text x="489" y="721" font-size="25" fill="#ac8cff" font-weight="600" text-anchor="start">PROFILE</text><text x="489" y="756" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Measure RX ring, CPU gaps,</text><text x="489" y="786" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">queue occupancy and frame age.</text><text x="937" y="721" font-size="25" fill="#69e4b5" font-weight="600" text-anchor="start">VERIFY</text><text x="937" y="756" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">Repeat longer runs; consider</text><text x="937" y="786" font-size="20" fill="#a7bad2" font-weight="400" text-anchor="start">frame IDs / CRC + optical checks.</text></g></svg>
