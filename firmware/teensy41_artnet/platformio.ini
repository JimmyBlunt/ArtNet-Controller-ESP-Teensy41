[platformio]
default_envs = teensy41_safe

[env]
platform = teensy@6.0.0
board = teensy41
platform_packages =
  platformio/framework-arduinoteensy@1.162.0
  platformio/toolchain-gccarmnoneeabi-teensy@1.150201.0
  platformio/tool-teensy@1.162.0
  platformio/tool-scons@4.40801.0
framework = arduino
build_src_filter = +<main.cpp>
lib_ldf_mode = off
lib_ignore = OctoWS2811
board_build.f_cpu = 600000000L
lib_deps =
  SPI
  https://github.com/FastLED/FastLED/archive/refs/tags/3.10.4.zip
  https://github.com/ssilverman/QNEthernet/archive/refs/tags/v0.37.0.zip
build_flags =
  -D FASTLED_USES_OBJECTFLED
  -D USB_SERIAL
monitor_speed = 115200
extra_scripts = pre:tools/patch_fastled.py
                pre:tools/patch_qnethernet.py

[env:teensy41_safe]
lib_deps =
  SPI
  https://github.com/ssilverman/QNEthernet/archive/refs/tags/v0.37.0.zip
build_flags = ${env.build_flags}
  -D PINOUT_CONFIRMED=0

; Compile-only fixture. ARM is refused even though seven drivers are instantiated.
; The fixture pin numbers are NOT a wiring recommendation.
[env:teensy41_driver_compile]
build_flags = ${env.build_flags}
  -D PINOUT_COMPILE_FIXTURE=1
  -D PINOUT_CONFIRMED=0

; Real hardware builds require a reviewed include/hardware_pins.h and explicit flag.
[env:teensy41_hardware]
build_flags = ${env.build_flags}
  -D PINOUT_CONFIRMED=1

; User-confirmed: this test board has Ethernet and USB, but no LEDs/wiring.
; Pins 2 through 8 emit test data only; never deploy this on a wired installation.
[env:teensy41_unwired_bench]
build_flags = ${env.build_flags}
  -D PINOUT_CONFIRMED=1
  -D BENCH_UNWIRED_PINS=1

; Separate, explicitly configured physical OUT1..OUT8 identification image.
; Canonical PJRC_OCTO_ADAPTER_T41 + ESP4031 split profile; USB TEST or explicit ARM.
; Does not change the RX32 receiver or the historical unwired GPIO fixture.
[env:teensy41_octo_identify_rx32]
build_src_filter = +<octo_identify.cpp>
build_flags = ${env.build_flags}
  -D OCTO_IDENTIFY_RX32=1
  -D OCTO_ESP_PROFILE=1
