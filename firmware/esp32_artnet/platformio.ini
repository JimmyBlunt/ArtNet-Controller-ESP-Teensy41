[platformio]
default_envs = native
src_dir = firmware/src
include_dir = firmware/include
data_dir = web/assets

[env]
extra_scripts = pre:tools/pio-build-web.py

[env:native]
platform = native@1.2.1
build_flags = -std=c++17 -Itests/stubs/rtos
test_build_src = yes

[env:esp32-power-diagnostic]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
build_flags = -std=c++17 -DLED_POWER_DIAGNOSTIC
build_src_filter = -<*> +<PowerDiagnostic.cpp>

[env:esp32-wifi]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
lib_deps =
    fastled/FastLED@3.10.3
    bblanchon/ArduinoJson@7.4.3
build_flags = -std=c++17 -DLED_PROFILE_WIFI

[env:esp32-wifi-matrix16]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
lib_deps =
    fastled/FastLED@3.10.3
    bblanchon/ArduinoJson@7.4.3
build_flags = -std=c++17 -DLED_PROFILE_WIFI -DLED_PROFILE_MATRIX16_TEST

[env:esp32-wifi-ws2812-output0]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
lib_deps =
    fastled/FastLED@3.10.3
    bblanchon/ArduinoJson@7.4.3
build_flags = -std=c++17 -DLED_PROFILE_WIFI -DLED_PROFILE_WS2812_OUTPUT0

[env:esp32-wifi-ws2812-apa102-1679]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
lib_deps =
    fastled/FastLED@3.10.3
    bblanchon/ArduinoJson@7.4.3
build_flags = -std=c++17 -DLED_PROFILE_WIFI -DLED_PROFILE_WS2812_APA102_1679

[env:esp32-wifi-flex8]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
lib_deps =
    fastled/FastLED@3.10.3
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -std=c++17
    -DLED_PROFILE_WIFI
    -DLED_PROFILE_FLEX8

[env:esp32-wifi-extensionboard]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
lib_deps =
    fastled/FastLED@3.10.3
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -std=c++17
    -DLED_PROFILE_WIFI
    -DLED_PROFILE_FLEX8
    -DLED_PROFILE_EXTENSION_BOARD

[env:esp32-wifi-esp251]
extends = env:esp32-wifi-flex8
build_flags = ${env:esp32-wifi-flex8.build_flags} -DLED_PROFILE_ESP251

[env:esp32-rmii-ethernet]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
lib_deps =
    fastled/FastLED@3.10.3
    bblanchon/ArduinoJson@7.4.3
build_flags = -std=c++17 -DLED_PROFILE_RMII_ETHERNET

[env:esp32-w5500]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
lib_deps =
    fastled/FastLED@3.10.3
    bblanchon/ArduinoJson@7.4.3
build_flags = -std=c++17 -DLED_PROFILE_W5500
